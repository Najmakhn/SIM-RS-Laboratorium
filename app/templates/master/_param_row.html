{% macro v(x) %}{{ '' if x is none else x }}{% endmacro %}
<tr>
  <td><input type="hidden" name="p_id" value="{{ p.id if p else '' }}"><input class="form-control form-control-sm" name="p_nama" value="{{ p.nama if p else '' }}" style="min-width:140px"></td>
  <td><input class="form-control form-control-sm" name="p_satuan" value="{{ p.satuan or '' if p else '' }}" style="width:80px"></td>
  <td><select class="form-select form-select-sm" name="p_tipe"><option value="angka" {{ 'selected' if p and p.tipe == 'angka' }}>angka</option><option value="pilihan" {{ 'selected' if p and p.tipe == 'pilihan' }}>pilihan</option></select></td>
  {% for f in ['ref_min_l','ref_max_l','ref_min_p','ref_max_p','krit_min','krit_max'] %}
  <td><input class="form-control form-control-sm" style="width:84px" name="p_{{ ['minl','maxl','minp','maxp','kmin','kmax'][loop.index0] }}" value="{{ v(p[f]) if p else '' }}"></td>{% endfor %}
  <td><input class="form-control form-control-sm" name="p_pilihan" value="{{ p.pilihan or '' if p else '' }}" style="min-width:150px"></td>
  <td><input class="form-control form-control-sm" name="p_normal" value="{{ p.nilai_normal or '' if p else '' }}" style="width:100px"></td>
  <td><input class="form-control form-control-sm" type="number" min="0" max="4" name="p_desimal" value="{{ p.desimal if p else 0 }}" style="width:64px"></td>
</tr>
